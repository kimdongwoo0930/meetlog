<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 48" width="160" height="48" fill="none">
  <!-- Icon block: blue bg + sound bars -->
  <rect x="0" y="0" width="48" height="48" rx="12" fill="#2563EB"/>

  <!-- Sound bars (5 bars, centered at x=24, baseline y=36) -->
  <!-- Bar 1 -->
  <rect x="8" y="26" width="5" height="10" rx="2.5" fill="white"/>
  <!-- Bar 2 -->
  <rect x="15.5" y="20" width="5" height="16" rx="2.5" fill="white"/>
  <!-- Bar 3 -->
  <rect x="23" y="14" width="5" height="22" rx="2.5" fill="white"/>
  <!-- Bar 4 -->
  <rect x="30.5" y="20" width="5" height="16" rx="2.5" fill="white"/>
  <!-- Bar 5 -->
  <rect x="38" y="26" width="5" height="10" rx="2.5" fill="white"/>

  <!-- Check badge: dark circle bottom-right -->
  <circle cx="38" cy="38" r="8" fill="#111110"/>
  <!-- Check mark -->
  <polyline points="34,38 37,41 42,35" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wordmark -->
  <text x="58" y="31"
    font-family="Inter, sans-serif"
    font-weight="700"
    font-size="22"
    letter-spacing="-0.5">
    <tspan fill="#1A1916">Meet</tspan><tspan fill="#2563EB">Log</tspan>
  </text>
</svg>
