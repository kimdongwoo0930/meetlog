spring.application.name=backend

# ═══════════════════════════════════════════════
#  MeetLog — 개발 환경 설정
# ═══════════════════════════════════════════════

# ── Server ──────────────────────────────────────
server.port=8080

# ── MySQL (Docker 컨테이너) ──────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/meetlog?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP 커넥션 풀
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# ── JPA / Hibernate ──────────────────────────────
# 개발 중: create-drop → 재시작 시 스키마 재생성
# 스키마 확정 후: update 또는 validate 로 변경
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

# ── JWT ──────────────────────────────────────────
# ⚠️ 운영 배포 전 반드시 강력한 시크릿으로 교체 (256-bit 이상)
jwt.secret==u04wiQjg1OsOueLuUNB4QQFwXJFNYBkXoyGeHaGXecRmf8cI+cZgFvAQHhsXyQIIjk5kOFUvP/T9OnmIc6RFDg==
jwt.access-token-expiry=1800000
# 30분 (ms)
jwt.refresh-token-expiry=604800000
# 7일 (ms)

# ── AI Server (FastAPI) ──────────────────────────
ai.server.url=http://localhost:8000
ai.server.timeout=120000
# 120초 (STT 처리 시간 고려)

# ── Logging ──────────────────────────────────────
logging.level.root=INFO
logging.level.com.meetlog=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE